# Existing Windows Redis port: local functional verification only.
bind 127.0.0.1
port 6380
protected-mode yes
maxclients 32
maxmemory 16mb
maxmemory-policy allkeys-lru
# Windows-specific: disable persistence and fork-backed heaps entirely.
persistence-available no
dir B:/python/SlimLLM/.cache/redis
logfile ""
